<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow v2 — Daily Task Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden}

/* Light mode vars */
:root{
  --bg:#f0f2f8;--surface:#fff;--surface2:#f8fafc;
  --sidebar:#16213e;--sidebar-hover:rgba(99,102,241,.18);
  --accent:#6366f1;--accent-dark:#4f46e5;--accent-light:#eef2ff;
  --text:#0f172a;--text-muted:#64748b;--text-faint:#94a3b8;
  --border:#e2e8f0;--border-focus:#a5b4fc;
  --p-high:#ef4444;--p-med:#f59e0b;--p-low:#3b82f6;
  --radius:9px;--shadow:0 1px 4px rgba(0,0,0,.07);--shadow-lg:0 12px 40px rgba(0,0,0,.18);
}
/* Dark mode vars */
html[data-theme=dark]{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263348;
  --sidebar:#080d19;--sidebar-hover:rgba(99,102,241,.22);
  --accent:#818cf8;--accent-dark:#6366f1;--accent-light:#1e1b4b;
  --text:#e2e8f0;--text-muted:#94a3b8;--text-faint:#64748b;
  --border:#334155;--border-focus:#6366f1;
  --shadow:0 1px 4px rgba(0,0,0,.2);--shadow-lg:0 12px 40px rgba(0,0,0,.4);
}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
html[data-theme=dark] ::-webkit-scrollbar-thumb{background:#334155}

@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.asl{animation:slideR .28s cubic-bezier(.16,1,.3,1)}
.afu{animation:fadeUp .18s ease}
.asc{animation:scaleIn .18s ease}

.cb{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;background:var(--surface)}
.cb:hover{border-color:var(--accent);background:var(--accent-light)}
.cb.done{background:var(--accent);border-color:var(--accent)}
.cb-sq{width:15px;height:15px;border-radius:4px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;background:var(--surface)}
.cb-sq:hover{border-color:var(--accent)}
.cb-sq.done{background:var(--accent);border-color:var(--accent)}

.task-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;transition:all .14s;background:var(--surface);position:relative}
.task-row:hover{border-color:var(--border);box-shadow:var(--shadow)}
.task-row .ract{opacity:0;transition:opacity .14s}
.task-row:hover .ract{opacity:1}

.sub-row{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 42px;border-radius:7px;cursor:pointer;transition:background .12s}
.sub-row:hover{background:var(--surface2)}
.sub-row .ract{opacity:0;transition:opacity .14s}
.sub-row:hover .ract{opacity:1}

.b-card{background:var(--surface);border-radius:var(--radius);padding:11px 13px;cursor:grab;box-shadow:var(--shadow);transition:all .15s;user-select:none}
.b-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
.b-card.dragging{opacity:.45;transform:rotate(2deg)}
html[data-theme=dark] .b-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.35)}

.cal-cell{border-radius:var(--radius);cursor:pointer;padding:5px 4px;min-height:76px;transition:background .12s}
.cal-cell:hover{background:var(--surface2)}
.cal-cell.is-today{background:var(--accent-light)}
.cal-cell.is-sel{outline:2px solid var(--accent);outline-offset:-2px}

.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;border:none;cursor:pointer;text-align:left;font-size:13px;font-family:inherit;transition:all .14s;color:var(--text-faint);background:transparent}
.nav-btn:hover{background:var(--sidebar-hover);color:#c7d2fe}
.nav-btn.active{background:#312e81;color:#e0e7ff;font-weight:500}

.inp{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;background:var(--surface);color:var(--text)}
.inp:focus{border-color:var(--border-focus)}

.badge{font-size:10px;padding:2px 7px;border-radius:20px;white-space:nowrap;color:white;line-height:1.4}
.lbl-chip{padding:3px 10px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .15s;border:1px solid transparent;font-family:inherit}
.lbl-chip.sel{color:white;font-weight:500}
.lbl-chip.unsel{background:transparent;color:var(--text-muted)}
.lbl-chip.unsel:hover{border-color:var(--border)}

kbd{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text)}
code{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--accent-light);color:var(--accent);padding:1px 5px;border-radius:4px}
pre code{display:block;white-space:pre;overflow-x:auto;line-height:1.6;padding:12px;border-radius:8px;font-size:11px}

.tog{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:white;transition:transform .2s}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(18px)}
.tog.off{background:#cbd5e1}
</style>
</head>
<body style="background:var(--bg)">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef,useMemo}=React;

/*────────── UTILS ──────────*/
const uid=()=>Math.random().toString(36).slice(2,11);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dateStr=d=>{if(!d)return null;const x=typeof d==='string'?new Date(d+'T00:00:00'):d;return`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dateStr(d)};
const addMonths=s=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+1);return dateStr(d)};
const dispDate=s=>{if(!s)return null;const t=todayStr();if(s===t)return'Today';if(s===addDays(t,1))return'Tomorrow';if(s===addDays(t,-1))return'Yesterday';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const isOv=s=>s&&s<todayStr();

const PMAP={high:'high',h:'high',urgent:'high',u:'high',medium:'medium',med:'medium',m:'medium',low:'low',l:'low'};
const DAYMAP={monday:1,mon:1,tuesday:2,tue:2,wednesday:3,wed:3,thursday:4,thu:4,friday:5,fri:5,saturday:6,sat:6,sunday:0,sun:0};
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

function parseInput(raw){
  let text=raw.trim(),labels=[],priority=null,dueDate=null;
  text=text.replace(/#(\w+)/g,(_,n)=>{labels.push(n);return''});
  text=text.replace(/!(high|medium|med|low|urgent|h|m|l|u)/gi,(_,p)=>{if(!priority)priority=PMAP[p.toLowerCase()];return''});
  const t=todayStr(),td=new Date(t+'T00:00:00');
  if(/\btmr\b/i.test(text)){dueDate=addDays(t,1);text=text.replace(/\btmr\b/i,'')}
  else if(/\btomorrow\b/i.test(text)){dueDate=addDays(t,1);text=text.replace(/\btomorrow\b/i,'')}
  else if(/\btoday\b/i.test(text)){dueDate=t;text=text.replace(/\btoday\b/i,'')}
  else{
    const dm=text.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tue|wed|thu|fri|sat|sun)\b/i);
    if(dm){const tgt=DAYMAP[dm[1].toLowerCase()],cur=td.getDay();let diff=tgt-cur;if(diff<=0)diff+=7;dueDate=addDays(t,diff);text=text.replace(dm[0],'')}
    else{
      const mm=text.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s*(\d{1,2})\b/i);
      if(mm){const mo=MONTHS[mm[1].toLowerCase()],day=parseInt(mm[2]),d=new Date(td.getFullYear(),mo,day);if(d<td)d.setFullYear(d.getFullYear()+1);dueDate=dateStr(d);text=text.replace(mm[0],'')}
      else{const md=text.match(/\b(\d{1,2})\/(\d{1,2})\b/);if(md){const d=new Date(td.getFullYear(),parseInt(md[1])-1,parseInt(md[2]));if(d<td)d.setFullYear(d.getFullYear()+1);dueDate=dateStr(d);text=text.replace(md[0],'')}}
    }
  }
  return{title:text.replace(/\s+/g,' ').trim(),labels,priority,dueDate};
}

/*────────── DATA MODEL ──────────*/
const normalizeSubtask=s=>({
  id:s.id||uid(),title:s.title||'',description:s.description||'',
  labels:s.labels||(s.label?[s.label]:[]),priority:s.priority||null,
  dueDate:s.dueDate||null,completed:s.completed||false,completedAt:s.completedAt||null,
});
const normalizeTask=t=>({
  ...t,
  labels:t.labels||(t.label?[t.label]:[]),
  subtasks:(t.subtasks||[]).map(normalizeSubtask),
  recurring:t.recurring||null,lastRecurredAt:t.lastRecurredAt||null,
});
const mkSubtask=o=>({id:uid(),title:'',description:'',labels:[],priority:null,dueDate:null,completed:false,completedAt:null,...o});
const mkTask=o=>({id:uid(),title:'',description:'',labels:[],priority:null,dueDate:null,completed:false,completedAt:null,boardColumn:'todo',subtasks:[],createdAt:new Date().toISOString(),recurring:null,lastRecurredAt:null,...o});

const DEF_LABELS=[{id:'l1',name:'Work',color:'#6366f1'},{id:'l2',name:'Personal',color:'#10b981'},{id:'l3',name:'Media',color:'#f59e0b'},{id:'l4',name:'Health',color:'#ef4444'}];
const DEF_COLS=[{id:'todo',name:'To Do',color:'#6366f1',order:0},{id:'in-progress',name:'In Progress',color:'#f59e0b',order:1},{id:'done',name:'Done',color:'#10b981',order:2}];

const makeDemo=()=>[
  mkTask({id:'d1',title:'Review Q4 campaign brief',labels:['Work'],priority:'high',dueDate:todayStr(),boardColumn:'in-progress',recurring:null,
    subtasks:[mkSubtask({id:'s1',title:'Read through brief',completed:true,labels:['Work'],priority:'high',dueDate:addDays(todayStr(),-1)}),mkSubtask({id:'s2',title:'Note key questions',completed:false,labels:['Work'],priority:'medium',dueDate:todayStr()}),mkSubtask({id:'s3',title:'Share feedback via email',completed:false,labels:['Work'],priority:'medium',dueDate:addDays(todayStr(),1)})],
    description:'Check KPI targets and channel mix before the 3pm alignment call.'}),
  mkTask({id:'d2',title:'Weekly team standup',labels:['Work'],priority:'medium',dueDate:todayStr(),boardColumn:'todo',recurring:'weekly',subtasks:[]}),
  mkTask({id:'d3',title:'Instagram story — Hitachi fridge launch',labels:['Media','Work'],priority:'high',dueDate:addDays(todayStr(),1),boardColumn:'todo',
    subtasks:[mkSubtask({id:'s4',title:'Write caption copy',labels:['Media'],priority:'high',dueDate:todayStr()}),mkSubtask({id:'s5',title:'Design story template',labels:['Media'],priority:'medium',dueDate:addDays(todayStr(),1)}),mkSubtask({id:'s6',title:'Schedule with Later at 7PM',labels:['Media'],priority:'low',dueDate:addDays(todayStr(),1)})],
    description:'Prepare 3-slide story set for the new Skyline Luxury model.'}),
];

/*────────── SUPABASE ──────────*/
let sbClient=null;
const initSB=()=>{
  try{
    const url=localStorage.getItem('tf_sb_url'),key=localStorage.getItem('tf_sb_key');
    if(url&&key&&typeof window.supabase!=='undefined'){sbClient=window.supabase.createClient(url,key);return true}
  }catch(e){}
  return false;
};
const isSBReady=()=>!!sbClient;

/*────────── RECURRING ──────────*/
const processRecurring=tasks=>{
  const today=todayStr();
  const toAdd=[];
  tasks.forEach(t=>{
    if(!t.recurring||!t.completed||!t.dueDate)return;
    if(t.lastRecurredAt===today)return;
    let next=null;
    if(t.recurring==='daily')next=today;
    else if(t.recurring==='weekly')next=addDays(t.dueDate,7);
    else if(t.recurring==='monthly')next=addMonths(t.dueDate);
    if(!next||next<today)next=today;
    const exists=tasks.some(x=>!x.completed&&x.title===t.title&&x.recurring===t.recurring);
    if(!exists)toAdd.push(mkTask({...t,id:uid(),completed:false,completedAt:null,lastRecurredAt:null,dueDate:next,boardColumn:t.boardColumn==='done'?'todo':t.boardColumn,subtasks:t.subtasks.map(s=>mkSubtask({...s,id:uid(),completed:false,completedAt:null})),createdAt:new Date().toISOString()}));
  });
  return toAdd;
};

/*────────── EXPORT ──────────*/
const exportData=(tasks,labels,columns)=>{
  const blob=new Blob([JSON.stringify({version:'2.0',exportedAt:new Date().toISOString(),tasks,labels,columns},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`taskflow-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);
};

/*────────── APP ──────────*/
function App(){
  const[tasks,setTasks]=useState(()=>{try{const s=localStorage.getItem('tf3_tasks');return(s?JSON.parse(s):makeDemo()).map(normalizeTask)}catch{return makeDemo()}});
  const[labels,setLabels]=useState(()=>{try{const s=localStorage.getItem('tf3_labels');return s?JSON.parse(s):DEF_LABELS}catch{return DEF_LABELS}});
  const[columns,setColumns]=useState(()=>{try{const s=localStorage.getItem('tf3_cols');return s?JSON.parse(s):DEF_COLS}catch{return DEF_COLS}});
  const[darkMode,setDarkMode]=useState(()=>localStorage.getItem('tf3_dark')==='1');
  const[view,setView]=useState('today');
  const[filterLabel,setFilterLabel]=useState(null);
  const[search,setSearch]=useState('');
  const[modal,setModal]=useState({type:null,taskId:null,subId:null});
  const[quickIn,setQuickIn]=useState('');
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const[sbStatus,setSbStatus]=useState(false);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');localStorage.setItem('tf3_dark',darkMode?'1':'0')},[darkMode]);
  useEffect(()=>{localStorage.setItem('tf3_tasks',JSON.stringify(tasks))},[tasks]);
  useEffect(()=>{localStorage.setItem('tf3_labels',JSON.stringify(labels))},[labels]);
  useEffect(()=>{localStorage.setItem('tf3_cols',JSON.stringify(columns))},[columns]);

  // Init Supabase + process recurring on load
  useEffect(()=>{
    setSbStatus(initSB());
    const recs=processRecurring(tasks);
    if(recs.length>0)setTasks(p=>[...recs,...p]);
  },[]);

  // Shortcuts
  useEffect(()=>{
    const h=e=>{
      const inField=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
      if((e.key==='q'||((e.ctrlKey||e.metaKey)&&e.key==='n'))&&!inField){e.preventDefault();setQuickIn('');setModal({type:'qa',taskId:null,subId:null})}
      if(e.key==='Escape')setModal({type:null,taskId:null,subId:null});
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);

  /* task ops */
  const addTask=useCallback(o=>{const t=mkTask(o);setTasks(p=>[t,...p]);return t},[]);
  const updTask=useCallback((id,p)=>setTasks(prev=>prev.map(t=>t.id===id?{...t,...p}:t)),[]);
  const delTask=useCallback(id=>setTasks(p=>p.filter(t=>t.id!==id)),[]);
  const dupTask=useCallback(id=>{const t=tasks.find(x=>x.id===id);if(!t)return;addTask({...t,id:uid(),title:t.title+' (copy)',completed:false,completedAt:null,subtasks:t.subtasks.map(s=>({...s,id:uid(),completed:false,completedAt:null})),createdAt:new Date().toISOString()})},[tasks,addTask]);
  const toggle=useCallback(id=>setTasks(p=>p.map(t=>t.id===id?{...t,completed:!t.completed,completedAt:!t.completed?new Date().toISOString():null,boardColumn:!t.completed?'done':t.boardColumn==='done'?'todo':t.boardColumn}:t)),[]);
  const toggleSub=useCallback((tid,sid)=>setTasks(p=>p.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,completed:!s.completed,completedAt:!s.completed?new Date().toISOString():null}:s)}:t)),[]);
  const addSub=useCallback((tid,o)=>setTasks(p=>p.map(t=>t.id===tid?{...t,subtasks:[...t.subtasks,mkSubtask(o)]}:t)),[]);
  const updSub=useCallback((tid,sid,patch)=>setTasks(p=>p.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,...patch}:s)}:t)),[]);
  const delSub=useCallback((tid,sid)=>setTasks(p=>p.map(t=>t.id===tid?{...t,subtasks:t.subtasks.filter(s=>s.id!==sid)}:t)),[]);

  /* label helpers */
  const getLabelColor=useCallback(name=>{if(!name)return'#94a3b8';return labels.find(l=>l.name===name)?.color||'#94a3b8'},[labels]);
  const autoCreateLabel=useCallback(name=>{if(!name)return;if(!labels.find(l=>l.name.toLowerCase()===name.toLowerCase())){const pal=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];setLabels(prev=>[...prev,{id:uid(),name,color:pal[prev.length%pal.length]}])}},[labels]);

  /* quick add */
  const handleQA=useCallback(()=>{
    const p=parseInput(quickIn);if(!p.title)return;
    p.labels.forEach(autoCreateLabel);
    addTask({...p,labels:p.labels.length?p.labels:(filterLabel&&!['board','calendar','help'].includes(filterLabel)?[filterLabel]:[]),dueDate:p.dueDate||(view==='today'?todayStr():null)});
    setModal({type:null,taskId:null,subId:null});
  },[quickIn,filterLabel,view,addTask,autoCreateLabel]);

  /* visible tasks */
  const visible=useMemo(()=>{
    let list=tasks;
    if(search){const q=search.toLowerCase();list=list.filter(t=>t.title.toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q)||t.labels.some(l=>l.toLowerCase().includes(q)))}
    if(filterLabel)list=list.filter(t=>t.labels.includes(filterLabel));
    if(view==='today')list=list.filter(t=>t.dueDate===todayStr());
    else if(view==='upcoming'){const lim=addDays(todayStr(),7);list=list.filter(t=>t.dueDate&&t.dueDate>=todayStr()&&t.dueDate<=lim)}
    return list;
  },[tasks,search,filterLabel,view]);

  const curTask=modal.taskId?tasks.find(t=>t.id===modal.taskId):null;
  const curSub=curTask&&modal.subId?curTask.subtasks.find(s=>s.id===modal.subId):null;
  const nav=(v,lbl=null)=>{setView(v);setFilterLabel(lbl)};
  const openTask=id=>setModal({type:'task',taskId:id,subId:null});
  const openSub=(tid,sid)=>setModal({type:'subtask',taskId:tid,subId:sid});

  return(
    <div style={{height:'100vh',display:'flex',overflow:'hidden',background:'var(--bg)'}}>
      <Sidebar view={view} filterLabel={filterLabel} labels={labels} tasks={tasks} open={sidebarOpen} setOpen={setSidebarOpen} nav={nav} openAddLbl={()=>setModal({type:'addlbl',taskId:null,subId:null})} getLabelColor={getLabelColor} sbStatus={sbStatus}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <TopBar view={view} filterLabel={filterLabel} search={search} setSearch={setSearch} openQA={()=>{setQuickIn('');setModal({type:'qa',taskId:null,subId:null})}} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} darkMode={darkMode} toggleDark={()=>setDarkMode(v=>!v)} openSettings={()=>setModal({type:'settings',taskId:null,subId:null})}/>
        <div style={{flex:1,overflowY:'auto',padding:'22px 24px'}}>
          {view==='help'?<HelpPage/>:view==='board'?<BoardView tasks={visible} columns={columns} labels={labels} getLabelColor={getLabelColor} updTask={updTask} toggle={toggle} delTask={delTask} dupTask={dupTask} openTask={openTask} addTask={addTask} manageColumns={()=>setModal({type:'cols',taskId:null,subId:null})}/>:view==='calendar'?<CalendarView tasks={tasks} getLabelColor={getLabelColor} openTask={openTask} openSub={openSub}/>:<ListView tasks={visible} view={view} labels={labels} getLabelColor={getLabelColor} toggle={toggle} toggleSub={toggleSub} delTask={delTask} dupTask={dupTask} openTask={openTask} openSub={openSub} addTask={addTask} addSub={addSub} autoCreateLabel={autoCreateLabel}/>}
        </div>
      </div>

      {modal.type==='qa'&&<QuickAddModal input={quickIn} setInput={setQuickIn} onAdd={handleQA} onClose={()=>setModal({type:null,taskId:null,subId:null})} labels={labels} getLabelColor={getLabelColor}/>}
      {modal.type==='task'&&curTask&&<TaskModal task={curTask} labels={labels} getLabelColor={getLabelColor} updTask={updTask} delTask={delTask} dupTask={dupTask} toggle={toggle} toggleSub={toggleSub} addSub={addSub} updSub={updSub} delSub={delSub} openSub={(sid)=>setModal({type:'subtask',taskId:curTask.id,subId:sid})} autoCreateLabel={autoCreateLabel} onClose={()=>setModal({type:null,taskId:null,subId:null})}/>}
      {modal.type==='subtask'&&curTask&&curSub&&<SubTaskModal sub={curSub} parentTask={curTask} labels={labels} getLabelColor={getLabelColor} onUpdate={patch=>updSub(curTask.id,curSub.id,patch)} onDelete={()=>{delSub(curTask.id,curSub.id);setModal({type:null,taskId:null,subId:null})}} autoCreateLabel={autoCreateLabel} onClose={()=>setModal({type:null,taskId:null,subId:null})}/>}
      {modal.type==='addlbl'&&<AddLabelModal labels={labels} onAdd={(n,c)=>{setLabels(p=>[...p,{id:uid(),name:n,color:c}]);setModal({type:null,taskId:null,subId:null})}} onClose={()=>setModal({type:null,taskId:null,subId:null})}/>}
      {modal.type==='cols'&&<ManageColumnsModal columns={columns} tasks={tasks} onSave={c=>setColumns(c)} onClose={()=>setModal({type:null,taskId:null,subId:null})}/>}
      {modal.type==='settings'&&<SettingsModal tasks={tasks} labels={labels} columns={columns} sbStatus={sbStatus} onSBConnect={()=>setSbStatus(initSB())} onImport={data=>{if(data.tasks)setTasks(data.tasks.map(normalizeTask));if(data.labels)setLabels(data.labels);if(data.columns)setColumns(data.columns)}} onExport={()=>exportData(tasks,labels,columns)} onClose={()=>setModal({type:null,taskId:null,subId:null})}/>}
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:6}}>

/*────────── LABEL SELECTOR ──────────*/
function LabelSelector({selectedLabels,labels,getLabelColor,onChange}){
  const toggle=name=>{const u=selectedLabels.includes(name)?selectedLabels.filter(l=>l!==name):[...selectedLabels,name];onChange(u)};
  return(
    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
      {labels.map(l=>{const sel=selectedLabels.includes(l.name);return(
        <button key={l.id} className={`lbl-chip ${sel?'sel':'unsel'}`} style={{background:sel?getLabelColor(l.name):'transparent',color:sel?'white':'var(--text-muted)',border:`1px solid ${sel?getLabelColor(l.name):'var(--border)'}`}} onClick={()=>toggle(l.name)}>{l.name}</button>
      )})}
    </div>
  );
}

/*────────── LIST VIEW ──────────*/
function ListView({tasks,view,labels,getLabelColor,toggle,toggleSub,delTask,dupTask,openTask,openSub,addTask,addSub,autoCreateLabel}){
  const[sortBy,setSortBy]=useState('date');
  const[groupBy,setGroupBy]=useState('none');
  const[inlineIn,setInlineIn]=useState('');
  const[showDone,setShowDone]=useState(false);
  const active=tasks.filter(t=>!t.completed);
  const done=tasks.filter(t=>t.completed);
  const sort=list=>[...list].sort((a,b)=>{
    if(sortBy==='priority'){const p={high:0,medium:1,low:2};return(p[a.priority]??3)-(p[b.priority]??3)}
    if(sortBy==='label')return(a.labels[0]||'').localeCompare(b.labels[0]||'');
    if(!a.dueDate)return 1;if(!b.dueDate)return-1;return a.dueDate.localeCompare(b.dueDate);
  });
  const group=list=>{
    if(groupBy==='label'){const g={};list.forEach(t=>{const k=t.labels[0]||'No Label';(g[k]??=[]).push(t)});return Object.entries(g).sort(([a],[b])=>a==='No Label'?1:b==='No Label'?-1:a.localeCompare(b))}
    if(groupBy==='priority'){const g={High:[],Medium:[],Low:[],'No Priority':[]};list.forEach(t=>{const k=t.priority?(t.priority[0].toUpperCase()+t.priority.slice(1)):'No Priority';(g[k]??=[]).push(t)});return Object.entries(g).filter(([,v])=>v.length>0)}
    return[['',sort(list)]];
  };
  const handleInline=()=>{
    if(!inlineIn.trim())return;
    const p=parseInput(inlineIn);if(!p.title)return;
    p.labels.forEach(autoCreateLabel);
    addTask({...p,dueDate:p.dueDate||(view==='today'?todayStr():null)});
    setInlineIn('');
  };
  const pIcons={High:'🔴',Medium:'🟡',Low:'🔵','No Priority':'⚪'};
  return(
    <div style={{maxWidth:730,margin:'0 auto'}}>
      <div style={{display:'flex',gap:7,marginBottom:14}}>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{fontSize:11,border:'1px solid var(--border)',borderRadius:7,padding:'5px 10px',background:'var(--surface)',color:'var(--text-muted)',outline:'none',cursor:'pointer',fontFamily:'inherit'}}>
          <option value="date">Sort: Date</option><option value="priority">Sort: Priority</option><option value="label">Sort: Label</option>
        </select>
        <select value={groupBy} onChange={e=>setGroupBy(e.target.value)} style={{fontSize:11,border:'1px solid var(--border)',borderRadius:7,padding:'5px 10px',background:'var(--surface)',color:'var(--text-muted)',outline:'none',cursor:'pointer',fontFamily:'inherit'}}>
          <option value="none">No Grouping</option><option value="label">Group: Label</option><option value="priority">Group: Priority</option>
        </select>
      </div>
      {group(active).map(([gn,gts])=>gts.length>0&&(
        <div key={gn} style={{marginBottom:18}}>
          {groupBy!=='none'&&gn&&(
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:7}}>
              {groupBy==='label'&&<span style={{width:9,height:9,borderRadius:'50%',background:getLabelColor(gn)}}></span>}
              {groupBy==='priority'&&<span style={{fontSize:11}}>{pIcons[gn]}</span>}
              <span style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>{gn}</span>
              <span style={{fontSize:10,color:'var(--text-faint)'}}>({gts.length})</span>
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {sort(gts).map(t=><TaskRow key={t.id} task={t} getLabelColor={getLabelColor} toggle={toggle} toggleSub={toggleSub} delTask={delTask} dupTask={dupTask} openTask={openTask} openSub={openSub} addSub={addSub} autoCreateLabel={autoCreateLabel}/>)}
          </div>
        </div>
      ))}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',border:'1.5px dashed var(--border)',borderRadius:9,marginTop:4,background:'var(--surface)'}}>
        <span style={{color:'#c7d2fe',fontSize:17,lineHeight:1}}>+</span>
        <input style={{flex:1,fontSize:13,border:'none',outline:'none',color:'var(--text)',background:'transparent',fontFamily:'inherit'}} placeholder="Add task…  (#Label  !High  today  tmr  Nov10  Friday)" value={inlineIn} onChange={e=>setInlineIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleInline()}/>
        {inlineIn&&<button onClick={handleInline} style={{background:'var(--accent)',color:'white',border:'none',borderRadius:6,padding:'4px 10px',fontSize:11,cursor:'pointer',fontFamily:'inherit'}}>↵ Add</button>}
      </div>
      {done.length>0&&(
        <div style={{marginTop:22}}>
          <button onClick={()=>setShowDone(v=>!v)} style={{background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--text-muted)',fontFamily:'inherit'}}>
            <span style={{fontSize:10}}>{showDone?'▾':'▸'}</span> Completed ({done.length})
          </button>
          {showDone&&<div className="afu" style={{marginTop:7,display:'flex',flexDirection:'column',gap:2}}>{done.map(t=><TaskRow key={t.id} task={t} getLabelColor={getLabelColor} toggle={toggle} toggleSub={toggleSub} delTask={delTask} dupTask={dupTask} openTask={openTask} openSub={openSub} addSub={addSub} autoCreateLabel={autoCreateLabel}/>)}</div>}
        </div>
      )}
      {active.length===0&&<div style={{textAlign:'center',padding:'52px 0',color:'var(--text-faint)'}}><div style={{fontSize:44,marginBottom:10}}>✨</div><p style={{fontWeight:500,color:'var(--text-muted)'}}>All clear!</p><p style={{fontSize:12,marginTop:4}}>Press <kbd>Q</kbd> or <kbd>Ctrl+N</kbd> to add a task</p></div>}
    </div>
  );
}

/*────────── TASK ROW ──────────*/
function TaskRow({task,getLabelColor,toggle,toggleSub,delTask,dupTask,openTask,openSub,addSub,autoCreateLabel}){
  const[hov,setHov]=useState(false);
  const[expanded,setExpanded]=useState(false);
  const[subIn,setSubIn]=useState('');
  const pBg={high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'};
  const ov=isOv(task.dueDate)&&!task.completed;
  const doneCount=task.subtasks.filter(s=>s.completed).length;
  const handleSubAdd=()=>{
    if(!subIn.trim())return;
    addSub(task.id,{title:subIn.trim()});
    setSubIn('');
  };
  return(
    <div>
      <div className="task-row" onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{opacity:task.completed?.6:1}}>
        {/* Expand toggle */}
        <button onClick={e=>{e.stopPropagation();setExpanded(v=>!v)}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:9,padding:'2px 4px',fontFamily:'inherit',flexShrink:0,width:16,opacity:task.subtasks.length>0?1:0,pointerEvents:task.subtasks.length>0?'all':'none'}}>
          {expanded?'▾':'▸'}
        </button>
        {/* Checkbox */}
        <div onClick={e=>{e.stopPropagation();toggle(task.id)}} className={`cb${task.completed?' done':''}`} style={{borderColor:task.priority&&!task.completed?pBg[task.priority]:undefined}}>
          {task.completed&&<span style={{color:'white',fontSize:10,fontWeight:700}}>✓</span>}
        </div>
        {/* Title */}
        <span onClick={()=>openTask(task.id)} style={{flex:1,fontSize:13.5,color:task.completed?'var(--text-faint)':'var(--text)',textDecoration:task.completed?'line-through':'none',cursor:'pointer'}}>{task.title}</span>
        {/* Meta */}
        {task.recurring&&<span style={{fontSize:10,color:'var(--text-faint)'}} title={`Recurring ${task.recurring}`}>↻</span>}
        {task.subtasks.length>0&&<span style={{fontSize:10,color:'var(--text-faint)',flexShrink:0}}>{doneCount}/{task.subtasks.length}</span>}
        {task.dueDate&&<span style={{fontSize:10,color:ov?'var(--p-high)':'var(--text-faint)',flexShrink:0}}>{dispDate(task.dueDate)}</span>}
        <div style={{display:'flex',gap:3,flexShrink:0}}>
          {task.labels.slice(0,2).map(l=><span key={l} className="badge" style={{background:getLabelColor(l)}}>{l}</span>)}
          {task.labels.length>2&&<span className="badge" style={{background:'var(--text-faint)'}}>+{task.labels.length-2}</span>}
        </div>
        {/* Actions */}
        <div className="ract" style={{display:'flex',gap:2}}>
          <button onClick={e=>{e.stopPropagation();dupTask(task.id)}} title="Duplicate" style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:12,padding:'2px 4px',lineHeight:1}}>⧉</button>
          <button onClick={e=>{e.stopPropagation();delTask(task.id)}} title="Delete" style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:15,padding:'2px 4px',lineHeight:1}}>×</button>
        </div>
      </div>
      {/* Sub-tasks (expanded) */}
      {expanded&&(
        <div className="afu" style={{paddingLeft:0}}>
          {task.subtasks.map(s=>(
            <div key={s.id} className="sub-row" onMouseEnter={e=>e.currentTarget.classList.add('hov')} onMouseLeave={e=>e.currentTarget.classList.remove('hov')}>
              <div onClick={e=>{e.stopPropagation();toggleSub(task.id,s.id)}} className={`cb-sq${s.completed?' done':''}`} style={{marginLeft:0,borderColor:s.priority&&!s.completed?{high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'}[s.priority]:undefined}}>
                {s.completed&&<span style={{color:'white',fontSize:9,fontWeight:700}}>✓</span>}
              </div>
              <span onClick={()=>openSub(task.id,s.id)} style={{flex:1,fontSize:12.5,color:s.completed?'var(--text-faint)':'var(--text)',textDecoration:s.completed?'line-through':'none',cursor:'pointer'}}>{s.title}</span>
              {s.priority&&<span style={{fontSize:9,color:{high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'}[s.priority]}}>●</span>}
              {s.dueDate&&<span style={{fontSize:10,color:isOv(s.dueDate)&&!s.completed?'var(--p-high)':'var(--text-faint)'}}>{dispDate(s.dueDate)}</span>}
              {s.labels.slice(0,1).map(l=><span key={l} className="badge" style={{background:getLabelColor(l),fontSize:9}}>{l}</span>)}
              <button className="ract" onClick={()=>openSub(task.id,s.id)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontSize:10,padding:'1px 4px',fontFamily:'inherit',flexShrink:0}}>edit</button>
            </div>
          ))}
          {/* Inline add sub */}
          <div style={{paddingLeft:42,paddingRight:12,paddingTop:4,paddingBottom:6,display:'flex',alignItems:'center',gap:7}}>
            <span style={{color:'var(--text-faint)',fontSize:12}}>+</span>
            <input style={{flex:1,fontSize:12,border:'none',outline:'none',color:'var(--text)',background:'transparent',fontFamily:'inherit'}} placeholder="Add sub-task…" value={subIn} onChange={e=>setSubIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSubAdd()}/>
            {subIn&&<button onClick={handleSubAdd} style={{background:'var(--accent)',color:'white',border:'none',borderRadius:5,padding:'3px 8px',fontSize:10,cursor:'pointer',fontFamily:'inherit'}}>+</button>}
          </div>
        </div>
      )}
    </div>
  );
}

/*────────── BOARD VIEW ──────────*/
function BoardView({tasks,columns,labels,getLabelColor,updTask,toggle,delTask,dupTask,openTask,addTask,manageColumns}){
  const[dragging,setDragging]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const[addIn,setAddIn]=useState(null);
  const[addIn2,setAddIn2]=useState('');
  const[sortBy,setSortBy]=useState('default');
  const[groupBy,setGroupBy]=useState('status');

  /* ── date helpers ── */
  const addD=(base,n)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const td=todayStr();
  const tmr=addD(td,1);
  const d2=addD(td,2);
  const d3=addD(td,3);

  /* ── dynamic column generation ── */
  const getDynCols=()=>{
    if(groupBy==='status')return[...columns].sort((a,b)=>a.order-b.order);
    if(groupBy==='label'){
      const used=new Set();tasks.forEach(t=>t.labels.forEach(l=>used.add(l)));
      const lCols=labels.filter(l=>used.has(l.name)).map(l=>({id:`lbl_${l.name}`,name:l.name,color:l.color,_lbl:l.name}));
      return[...lCols,{id:'lbl__none',name:'No Label',color:'#94a3b8',_lbl:null}];
    }
    if(groupBy==='date')return[
      {id:'dt_today',name:'Today',color:'#6366f1',_date:'today'},
      {id:'dt_tmr',name:'Tomorrow',color:'#10b981',_date:'tmr'},
      {id:'dt_next2',name:'Next 2 Days',color:'#f59e0b',_date:'next2'},
      {id:'dt_later',name:'Later',color:'#8b5cf6',_date:'later'},
      {id:'dt_none',name:'No Date',color:'#94a3b8',_date:'none'},
    ];
    return[...columns].sort((a,b)=>a.order-b.order);
  };
  const dynCols=getDynCols();

  /* ── get tasks per column ── */
  const getColTasks=col=>{
    const list=tasks.filter(t=>!t.completed);
    if(groupBy==='status')return list.filter(t=>t.boardColumn===col.id);
    if(groupBy==='label'){
      if(col._lbl===null)return list.filter(t=>!t.labels||t.labels.length===0);
      return list.filter(t=>t.labels&&t.labels.includes(col._lbl));
    }
    if(groupBy==='date'){
      if(col._date==='today')return list.filter(t=>t.dueDate===td);
      if(col._date==='tmr')return list.filter(t=>t.dueDate===tmr);
      if(col._date==='next2')return list.filter(t=>t.dueDate===d2||t.dueDate===d3);
      if(col._date==='later')return list.filter(t=>t.dueDate&&t.dueDate>d3);
      return list.filter(t=>!t.dueDate);
    }
    return list;
  };

  const sortTasks=list=>{
    if(sortBy==='priority'){const p={high:0,medium:1,low:2};return[...list].sort((a,b)=>(p[a.priority]??3)-(p[b.priority]??3))}
    if(sortBy==='label')return[...list].sort((a,b)=>(a.labels[0]||'').localeCompare(b.labels[0]||''));
    if(sortBy==='timeline')return[...list].sort((a,b)=>{if(!a.dueDate)return 1;if(!b.dueDate)return-1;return a.dueDate.localeCompare(b.dueDate)});
    return list;
  };

  /* ── drag & drop ── */
  const handleDrop=col=>{
    if(!dragging)return;
    if(groupBy==='status'){
      updTask(dragging,{boardColumn:col.id,completed:col.id==='done',completedAt:col.id==='done'?new Date().toISOString():null});
    } else if(groupBy==='label'){
      if(col._lbl===null){updTask(dragging,{labels:[]});}
      else{const t=tasks.find(x=>x.id===dragging);if(t)updTask(dragging,{labels:[col._lbl,...(t.labels||[]).filter(l=>l!==col._lbl)]});}
    } else if(groupBy==='date'){
      let dd=null;
      if(col._date==='today')dd=td;
      else if(col._date==='tmr')dd=tmr;
      else if(col._date==='next2')dd=d2;
      else if(col._date==='later'){const nx=new Date(td+'T00:00:00');nx.setDate(nx.getDate()+8);dd=nx.toISOString().slice(0,10);}
      updTask(dragging,{dueDate:dd});
    }
    setDragging(null);setDragOver(null);
  };

  /* ── inline add ── */
  const handleColAdd=col=>{
    if(!addIn2.trim())return;
    const p=parseInput(addIn2);if(!p.title)return;
    const extra={};
    if(groupBy==='status')extra.boardColumn=col.id;
    else if(groupBy==='label'&&col._lbl)extra.labels=[col._lbl];
    else if(groupBy==='date'){
      if(col._date==='today')extra.dueDate=td;
      else if(col._date==='tmr')extra.dueDate=tmr;
      else if(col._date==='next2')extra.dueDate=d2;
    }
    addTask({...p,...extra});setAddIn2('');setAddIn(null);
  };

  const pBg={high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'};
  const selSt={fontSize:11,border:'1px solid var(--border)',borderRadius:7,padding:'5px 10px',background:'var(--surface)',color:'var(--text-muted)',outline:'none',cursor:'pointer',fontFamily:'inherit'};

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <select value={groupBy} onChange={e=>{setGroupBy(e.target.value);setAddIn(null);}} style={selSt}>
          <option value="status">Group: Status</option>
          <option value="label">Group: Label</option>
          <option value="date">Group: Date</option>
        </select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={selSt}>
          <option value="default">Sort: Default</option><option value="priority">Sort: Priority</option><option value="label">Sort: Label</option><option value="timeline">Sort: Timeline</option>
        </select>
        {groupBy==='status'&&<button onClick={manageColumns} style={{background:'none',border:'1px solid var(--border)',borderRadius:7,padding:'5px 12px',fontSize:11,cursor:'pointer',color:'var(--text-muted)',fontFamily:'inherit'}}>⚙ Manage Columns</button>}
      </div>
      <div style={{display:'flex',gap:14,height:'calc(100vh - 160px)',overflowX:'auto',paddingBottom:16,alignItems:'flex-start'}}>
        {dynCols.map(col=>{
          const colT=sortTasks(getColTasks(col));
          const over=dragOver===col.id;
          return(
            <div key={col.id} onDragOver={e=>{e.preventDefault();setDragOver(col.id)}} onDragLeave={()=>setDragOver(null)} onDrop={()=>handleDrop(col)} style={{minWidth:270,flex:1,maxWidth:340,background:over?'var(--accent-light)':'var(--surface2)',borderRadius:12,padding:13,display:'flex',flexDirection:'column',border:over?'2px dashed var(--accent)':'2px solid transparent',transition:'all .15s'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span style={{width:11,height:11,borderRadius:'50%',background:col.color,flexShrink:0}}></span>
                <span style={{fontWeight:600,fontSize:12,color:'var(--text)'}}>{col.name}</span>
                {groupBy==='date'&&col._date==='today'&&<span style={{fontSize:9,background:'var(--accent)',color:'white',borderRadius:10,padding:'1px 6px',fontWeight:600}}>TODAY</span>}
                <span style={{marginLeft:'auto',fontSize:10,color:'var(--text-faint)',background:'var(--surface)',borderRadius:12,padding:'2px 7px'}}>{colT.length}</span>
              </div>
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:8,minHeight:80,overflowY:'auto',maxHeight:'calc(100vh - 260px)'}}>
                {colT.map(t=>(
                  <div key={t.id} draggable onDragStart={()=>setDragging(t.id)} onDragEnd={()=>{setDragging(null);setDragOver(null)}} onClick={()=>openTask(t.id)} className={`b-card${dragging===t.id?' dragging':''}`} style={{borderTop:t.priority?`3px solid ${pBg[t.priority]}`:'3px solid transparent'}}>
                    <p style={{fontSize:12.5,fontWeight:500,color:'var(--text)',marginBottom:7,lineHeight:1.4}}>{t.title}</p>
                    <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                      {t.labels.slice(0,2).map(l=><span key={l} className="badge" style={{background:getLabelColor(l),fontSize:9}}>{l}</span>)}
                      {t.dueDate&&<span style={{fontSize:9,color:isOv(t.dueDate)?'var(--p-high)':'var(--text-faint)'}}>📅 {dispDate(t.dueDate)}</span>}
                      {t.recurring&&<span style={{fontSize:9,color:'var(--text-faint)'}}>↻</span>}
                      {t.subtasks.length>0&&<span style={{fontSize:9,color:'var(--text-faint)',marginLeft:'auto'}}>{t.subtasks.filter(s=>s.completed).length}/{t.subtasks.length}</span>}
                    </div>
                    <div className="ract" style={{display:'flex',gap:5,marginTop:6}}>
                      <button onClick={e=>{e.stopPropagation();dupTask(t.id)}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:11,padding:0,fontFamily:'inherit'}} title="Duplicate">⧉</button>
                      <button onClick={e=>{e.stopPropagation();delTask(t.id)}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:12,padding:0,fontFamily:'inherit'}}>×</button>
                    </div>
                  </div>
                ))}
              </div>
              {addIn===col.id?(
                <div style={{marginTop:8}}>
                  <input autoFocus className="inp" style={{width:'100%',boxSizing:'border-box',marginBottom:6,fontSize:12}} placeholder="Task name… (#Label !High tmr)" value={addIn2} onChange={e=>setAddIn2(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleColAdd(col);if(e.key==='Escape'){setAddIn(null);setAddIn2('')}}}/>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={()=>handleColAdd(col)} style={{flex:1,background:'var(--accent)',color:'white',border:'none',borderRadius:6,padding:'6px 0',fontSize:11,cursor:'pointer',fontFamily:'inherit'}}>Add</button>
                    <button onClick={()=>{setAddIn(null);setAddIn2('')}} style={{flex:1,background:'var(--border)',border:'none',borderRadius:6,padding:'6px 0',fontSize:11,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
                  </div>
                </div>
              ):<button onClick={()=>setAddIn(col.id)} style={{marginTop:8,background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--text-faint)',display:'flex',alignItems:'center',gap:4,padding:'5px 0',fontFamily:'inherit'}}>+ Add task</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/*────────── CALENDAR VIEW ──────────*/
function CalendarView({tasks,getLabelColor,openTask,openSub}){
  const[mon,setMon]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}});
  const[selDay,setSelDay]=useState(null);
  const{y,m}=mon;
  const first=new Date(y,m,1),last=new Date(y,m+1,0),startDow=first.getDay();
  const days=[];
  for(let i=0;i<startDow;i++)days.push({d:new Date(y,m,i-startDow+1),cur:false});
  for(let d=1;d<=last.getDate();d++)days.push({d:new Date(y,m,d),cur:true});
  while(days.length%7!==0)days.push({d:new Date(y,m+1,days.length-last.getDate()-startDow+1),cur:false});

  const tasksOn=date=>{
    const ds=dateStr(date);
    const main=tasks.filter(t=>t.dueDate===ds);
    const subs=[];tasks.forEach(t=>t.subtasks.forEach(s=>{if(s.dueDate===ds)subs.push({...s,pid:t.id,plabels:t.labels,ptitle:t.title,pLabelColor:getLabelColor(t.labels[0])})}));
    return{main,subs};
  };
  const selStr=selDay?dateStr(selDay):null;
  const selData=selDay?tasksOn(selDay):null;
  return(
    <div style={{display:'flex',gap:18,alignItems:'flex-start'}}>
      <div style={{flex:1}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <button onClick={()=>setMon(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 13px',cursor:'pointer',fontSize:13,fontFamily:'inherit',color:'var(--text)'}}>←</button>
          <h2 style={{fontSize:15,fontWeight:600,color:'var(--text)'}}>{new Date(y,m).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>
          <button onClick={()=>setMon(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 13px',cursor:'pointer',fontSize:13,fontFamily:'inherit',color:'var(--text)'}}>→</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:3}}>
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'var(--text-faint)',padding:'3px 0',textTransform:'uppercase',letterSpacing:'.06em'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
          {days.map((day,i)=>{
            const ds=dateStr(day.d);
            const{main,subs}=tasksOn(day.d);
            const shownMain=Math.min(main.length,2);
            const shownSubs=main.length<2?Math.min(subs.length,2-main.length):0;
            const all=main.length+subs.length;
            const hidden=all-(shownMain+shownSubs);
            const isTod=ds===todayStr();
            const isSel=ds===selStr;
            return(
              <div key={i} className={`cal-cell${isTod?' is-today':''}${isSel?' is-sel':''}`} onClick={()=>setSelDay(day.d)} style={{opacity:day.cur?1:.3}}>
                <div style={{display:'flex',justifyContent:'center',marginBottom:3}}>
                  <span style={{width:22,height:22,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:isTod?700:400,background:isTod?'var(--accent)':'transparent',color:isTod?'white':'var(--text)'}}>{day.d.getDate()}</span>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  {main.slice(0,2).map(t=>(
                    <div key={t.id} onClick={e=>{e.stopPropagation();openTask(t.id)}} title={t.title} style={{fontSize:8,padding:'1px 4px',borderRadius:3,background:getLabelColor(t.labels[0]),color:'white',textOverflow:'ellipsis',overflow:'hidden',whiteSpace:'nowrap',lineHeight:'13px',cursor:'pointer'}}>{t.title}</div>
                  ))}
                  {subs.slice(0,main.length<2?2-main.length:0).map(s=>(
                    <div key={s.id} onClick={e=>{e.stopPropagation();openSub(s.pid,s.id)}} style={{fontSize:8,padding:'2px 4px 2px 6px',borderRadius:3,background:getLabelColor(s.labels[0])||s.pLabelColor,color:'white',opacity:.88,borderLeft:'3px solid rgba(0,0,0,.28)',cursor:'pointer',overflow:'hidden'}}>
                      <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:'12px',fontWeight:500}}>↳ {s.title}</div>
                      <div style={{fontSize:7,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:'11px',opacity:.82,marginTop:1}}>{s.ptitle}</div>
                    </div>
                  ))}
                  {hidden>0&&<div style={{fontSize:8,color:'var(--text-faint)',paddingLeft:2}}>+{hidden} more</div>}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{marginTop:10,display:'flex',gap:14,fontSize:10,color:'var(--text-faint)'}}>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:14,height:7,background:'var(--accent)',borderRadius:2,display:'inline-block'}}></span>Main task</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:14,height:7,background:'var(--accent)',opacity:.7,borderRadius:2,borderLeft:'3px solid rgba(0,0,0,.3)',display:'inline-block'}}></span>Sub-task (click to edit)</span>
        </div>
      </div>
      {selDay&&(
        <div className="afu" style={{width:258,background:'var(--surface)',borderRadius:12,padding:16,boxShadow:'var(--shadow)',border:'1px solid var(--border)',flexShrink:0,position:'sticky',top:0,maxHeight:'calc(100vh - 100px)',overflowY:'auto'}}>
          <p style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:10}}>{selDay.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'})}</p>
          {selData&&(selData.main.length+selData.subs.length===0?(
            <p style={{fontSize:11,color:'var(--text-faint)'}}>No tasks on this day</p>
          ):(
            <>
              {selData.main.map(t=>(
                <div key={t.id} onClick={()=>openTask(t.id)} style={{display:'flex',alignItems:'center',gap:7,padding:'5px 6px',borderRadius:6,cursor:'pointer',marginBottom:2}} onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{width:9,height:9,borderRadius:2,background:getLabelColor(t.labels[0]),flexShrink:0}}></span>
                  <span style={{fontSize:11,flex:1,color:t.completed?'var(--text-faint)':'var(--text)',textDecoration:t.completed?'line-through':'none'}}>{t.title}</span>
                  {t.priority&&<span style={{fontSize:8,color:{high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'}[t.priority]}}>●</span>}
                </div>
              ))}
              {selData.subs.map(s=>(
                <div key={s.id} onClick={()=>openSub(s.pid,s.id)} style={{display:'flex',alignItems:'center',gap:7,padding:'4px 6px 4px 16px',borderRadius:6,cursor:'pointer',marginBottom:2}} onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{color:'var(--text-faint)',fontSize:10}}>└</span>
                  <span style={{width:7,height:7,borderRadius:2,background:getLabelColor(s.labels[0])||s.pLabelColor,opacity:.8,flexShrink:0}}></span>
                  <div style={{flex:1}}>
                    <span style={{fontSize:10,color:s.completed?'var(--text-faint)':'var(--text)',textDecoration:s.completed?'line-through':'none',display:'block'}}>{s.title}</span>
                    <span style={{fontSize:9,color:'var(--text-faint)'}}>{s.ptitle}</span>
                  </div>
                  {s.priority&&<span style={{fontSize:8,color:{high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'}[s.priority]}}>●</span>}
                </div>
              ))}
            </>
          ))}
        </div>
      )}
    </div>
  );
}

/*────────── TASK DETAIL MODAL ──────────*/
function TaskModal({task,labels,getLabelColor,updTask,delTask,dupTask,toggle,toggleSub,addSub,updSub,delSub,openSub,autoCreateLabel,onClose}){

  const[subIn,setSubIn]=useState('');

  const saveT=()=>{if(title.trim())updTask(task.id,{title:title.trim()})};
  const saveD=()=>updTask(task.id,{description:desc});
  const doAddSub=()=>{if(!subIn.trim())return;addSub(task.id,{title:subIn.trim()});setSubIn('')};
  const done=task.subtasks.filter(s=>s.completed).length;
  const prog=task.subtasks.length>0?done/task.subtasks.length*100:0;
  const pBg={high:'var(--p-high)',medium:'var(--p-med)',low:'var(--p-low)'};
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,23,42,.35)',display:'flex',justifyContent:'flex-end',zIndex:60}}>
      <div onClick={e=>e.stopPropagation()} className="asl" style={{background:'var(--surface)',width:'100%',maxWidth:460,height:'100%',overflowY:'auto',boxShadow:'-8px 0 32px rgba(0,0,0,.12)'}}>
        <div style={{padding:'18px 18px 14px',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:11,marginBottom:14}}>
            <div onClick={()=>toggle(task.id)} className={`cb${task.completed?' done':''}`} style={{marginTop:3,borderColor:task.priority&&!task.completed?pBg[task.priority]:undefined}}>
              {task.completed&&<span style={{color:'white',fontSize:10,fontWeight:700}}>✓</span>}
            </div>
            <input style={{flex:1,fontSize:16,fontWeight:600,border:'none',outline:'none',color:task.completed?'var(--text-faint)':'var(--text)',textDecoration:task.completed?'line-through':'none',background:'transparent',fontFamily:'inherit'}} value={title} onChange={e=>setTitle(e.target.value)} onBlur={saveT} onKeyDown={e=>{if(e.key==='Enter'){saveT();e.target.blur()}}}/>
            <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:17,color:'var(--text-faint)',padding:'0 2px',flexShrink:0,lineHeight:1}}>×</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
            <div><label style={{fontSize:10,color:'var(--text-faint)',fontWeight:500,display:'block',marginBottom:3}}>Due Date</label>
              <input type="date" className="inp" style={{width:'100%',boxSizing:'border-box',fontSize:11}} value={task.dueDate||''} onChange={e=>updTask(task.id,{dueDate:e.target.value||null})}/>
            </div>

/*────────── MANAGE COLUMNS MODAL ──────────*/
function ManageColumnsModal({columns,tasks,onSave,onClose}){
  const[cols,setCols]=useState(()=>[...columns].sort((a,b)=>a.order-b.order));
  const upd=(id,field,val)=>setCols(p=>p.map(c=>c.id===id?{...c,[field]:val}:c));
  const add=()=>setCols(p=>[...p,{id:uid(),name:'New Column',color:'#6366f1',order:p.length}]);
  const rm=id=>{
    if(id==='done')return;
    const tasksInCol=tasks.filter(t=>t.boardColumn===id&&!t.completed).length;
    if(tasksInCol>0){alert(`Move all ${tasksInCol} tasks out of this column before deleting it.`);return}
    setCols(p=>p.filter(c=>c.id!==id));
  };
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,23,42,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:60}}>
      <div onClick={e=>e.stopPropagation()} className="asc" style={{background:'var(--surface)',borderRadius:14,padding:24,width:380,boxShadow:'var(--shadow-lg)'}}>
        <h3 style={{fontWeight:700,fontSize:16,marginBottom:14,color:'var(--text)'}}>Manage Board Columns</h3>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
          {cols.map(col=>(
            <div key={col.id} style={{display:'flex',alignItems:'center',gap:8}}>
              <input type="color" value={col.color} onChange={e=>upd(col.id,'color',e.target.value)} style={{width:28,height:28,border:'none',borderRadius:6,cursor:'pointer',padding:2}}/>
              <input className="inp" style={{flex:1,fontSize:12}} value={col.name} onChange={e=>upd(col.id,'name',e.target.value)}/>
              {col.id!=='done'?(<button onClick={()=>rm(col.id)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-faint)',fontSize:16,padding:'0 4px',lineHeight:1,fontFamily:'inherit'}}>×</button>):(<span style={{color:'var(--text-faint)',fontSize:10,padding:'0 6px'}} title="Done column cannot be removed">🔒</span>)}
            </div>
          ))}
        </div>
        <button onClick={add} style={{background:'none',border:'1.5px dashed var(--border)',borderRadius:8,padding:'7px 14px',fontSize:12,cursor:'pointer',color:'var(--text-muted)',width:'100%',fontFamily:'inherit',marginBottom:14}}>+ Add Column</button>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>{onSave(cols.map((c,i)=>({...c,order:i})));onClose()}} style={{flex:1,background:'var(--accent)',color:'white',border:'none',borderRadius:8,padding:'9px 0',fontSize:13,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>Save Columns</button>
          <button onClick={onClose} style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 0',fontSize:13,cursor:'pointer',fontFamily:'inherit',color:'var(--text)'}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/*────────── SETTINGS MODAL ──────────*/
const SB_SQL=`-- Run this in your Supabase SQL editor:
CREATE TABLE tasks (
  id TEXT PRIMARY KEY, title TEXT DEFAULT '', description TEXT DEFAULT '',
  labels TEXT[] DEFAULT '{}', priority TEXT, due_date TEXT,
  completed BOOLEAN DEFAULT FALSE, completed_at TIMESTAMPTZ,
  board_column TEXT DEFAULT 'todo', recurring TEXT, last_recurred_at TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW(), user_id UUID REFERENCES auth.users(id)
);
CREATE TABLE subtasks (
  id TEXT PRIMARY KEY, task_id TEXT REFERENCES tasks(id) ON DELETE CASCADE,
  title TEXT DEFAULT '', description TEXT DEFAULT '', labels TEXT[] DEFAULT '{}',
  priority TEXT, due_date TEXT, completed BOOLEAN DEFAULT FALSE,
  completed_at TIMESTAMPTZ
);
CREATE TABLE labels (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, color TEXT DEFAULT '#6366f1',
  user_id UUID REFERENCES auth.users(id)
);
CREATE TABLE board_columns (
  id TEXT PRIMARY KEY, name TEXT NOT NULL, color TEXT DEFAULT '#6366f1',
  col_order INTEGER DEFAULT 0, user_id UUID REFERENCES auth.users(id)
);
-- Enable RLS on all tables and add policies`;

function SettingsModal({tasks,labels,columns,sbStatus,onSBConnect,onImport,onExport,onClose}){
  const[url,setUrl]=useState(()=>localStorage.getItem('tf_sb_url')||'');
  const[key,setKey]=useState(()=>localStorage.getItem('tf_sb_key')||'');
  const[copied,setCopied]=useState(false);
  const saveSB=()=>{localStorage.setItem('tf_sb_url',url);localStorage.setItem('tf_sb_key',key);onSBConnect()};
  const copySQL=()=>{navigator.clipboard.writeText(SB_SQL);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  const fileRef=useRef();
  const handleImport=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);onImport(d)}catch{alert('Invalid backup file')}};r.readAsText(f);
  };
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,23,42,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:60}}>
      <div onClick={e=>e.stopPropagation()} className="asc" style={{background:'var(--surface)',borderRadius:14,padding:24,width:480,maxHeight:'85vh',overflowY:'auto',boxShadow:'var(--shadow-lg)'}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:16}}>
          <h3 style={{fontWeight:700,fontSize:16,color:'var(--text)',flex:1}}>⚙️ Settings</h3>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:17,color:'var(--text-faint)',lineHeight:1}}>×</button>
        </div>

        {/* Export / Import */}
        <div style={{background:'var(--surface2)',borderRadius:9,padding:'14px',marginBottom:14}}>
          <p style={{fontWeight:600,fontSize:12,color:'var(--text)',marginBottom:10}}>💾 Data Backup</p>
          <div style={{display:'flex',gap:8}}>
            <button onClick={onExport} style={{flex:1,background:'var(--accent)',color:'white',border:'none',borderRadius:7,padding:'8px 0',fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>📤 Export JSON ({tasks.length} tasks)</button>
            <button onClick={()=>fileRef.current.click()} style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:7,padding:'8px 0',fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text)'}}>📥 Import JSON</button>
            <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImport}/>
          </div>
        </div>

        {/* Supabase */}
        <div style={{background:'var(--surface2)',borderRadius:9,padding:'14px',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <p style={{fontWeight:600,fontSize:12,color:'var(--text)',flex:1}}>☁️ Supabase Sync</p>
            <span style={{fontSize:10,padding:'2px 8px',borderRadius:20,background:sbStatus?'#dcfce7':'#fef3c7',color:sbStatus?'#166534':'#92400e',fontWeight:600}}>{sbStatus?'✓ Connected':'Not connected'}</span>
          </div>
          <input className="inp" style={{width:'100%',boxSizing:'border-box',marginBottom:7,fontSize:11}} placeholder="Supabase Project URL (https://xxxx.supabase.co)" value={url} onChange={e=>setUrl(e.target.value)}/>
          <input className="inp" style={{width:'100%',boxSizing:'border-box',marginBottom:10,fontSize:11}} type="password" placeholder="Supabase Anon Key" value={key} onChange={e=>setKey(e.target.value)}/>
          <button onClick={saveSB} style={{width:'100%',background:'#1a7f4b',color:'white',border:'none',borderRadius:7,padding:'8px 0',fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:'inherit',marginBottom:10}}>Connect Supabase</button>
          <details>
            <summary style={{fontSize:11,color:'var(--accent)',cursor:'pointer',marginBottom:6}}>View SQL Schema to run in Supabase ▾</summary>
            <div style={{position:'relative'}}>
              <pre style={{background:'var(--bg)',borderRadius:7,padding:'10px',overflow:'auto',maxHeight:200}}><code style={{fontSize:10,color:'var(--text)',background:'transparent',lineHeight:1.6}}>{SB_SQL}</code></pre>
              <button onClick={copySQL} style={{position:'absolute',top:6,right:6,background:'var(--accent)',color:'white',border:'none',borderRadius:5,padding:'3px 8px',fontSize:10,cursor:'pointer',fontFamily:'inherit'}}>{copied?'✓ Copied':'Copy SQL'}</button>
            </div>
          </details>
        </div>

        {/* Stats */}
        <div style={{background:'var(--surface2)',borderRadius:9,padding:'14px'}}>
          <p style={{fontWeight:600,fontSize:12,color:'var(--text)',marginBottom:10}}>📊 Stats</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
            {[['Tasks',tasks.length],['Completed',tasks.filter(t=>t.completed).length],['Labels',labels.length]].map(([k,v])=>(
              <div key={k} style={{textAlign:'center',background:'var(--surface)',borderRadius:7,padding:'10px 6px'}}>
                <div style={{fontSize:20,fontWeight:700,color:'var(--accent)'}}>{v}</div>
                <div style={{fontSize:10,color:'var(--text-faint)'}}>{k}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

          <thead><tr style={{borderBottom:'2px solid var(--border)'}}><th style={{textAlign:'left',padding:'5px 7px',color:'var(--text-muted)',fontWeight:600,width:'32%'}}>Cú pháp</th><th style={{textAlign:'left',padding:'5px 7px',color:'var(--text-muted)',fontWeight:600,width:'33%'}}>Chức năng</th><th style={{textAlign:'left',padding:'5px 7px',color:'var(--text-muted)',fontWeight:600}}>Ví dụ</th></tr></thead>
          <tbody>{[['#Work #Media','1 hoặc nhiều label','Gán 2 label cùng lúc'],['!High / !h','Ưu tiên Cao','!h = !High'],['!Medium / !m','Ưu tiên Vừa','!m hoặc !Medium'],['!Low / !l','Ưu tiên Thấp','!l'],['today','Hạn hôm nay','Buy coffee today'],['tmr / tomorrow','Ngày mai','Call tmr'],['Mon ~ Sun','Thứ trong tuần','Review slides Friday'],['Monday ~ Sunday','Tên đầy đủ','Submit Monday'],['Nov05 / Nov 5','Ngày cụ thể','Submit Nov 10'],['11/05','Định dạng MM/DD','Review 11/15']].map(([s,d,ex],i)=>(
            <tr key={i} style={{borderBottom:'1px solid var(--border)'}}><td style={{padding:'6px 7px',fontFamily:'JetBrains Mono,monospace',fontWeight:600,color:'var(--accent)',fontSize:11}}>{s}</td><td style={{padding:'6px 7px',color:'var(--text)'}}>{d}</td><td style={{padding:'6px 7px',color:'var(--text-faint)',fontStyle:'italic'}}>{ex}</td></tr>
          ))}</tbody>
        </table>
        <div style={{marginTop:12,background:'var(--accent-light)',borderRadius:8,padding:'11px 13px'}}><p style={{fontSize:11,fontWeight:600,color:'var(--accent-dark)',marginBottom:3}}>💡 Full example:</p><code style={{fontSize:11,color:'var(--accent)',background:'transparent'}}>KOL brief #Work #Media !High Nov10</code><p style={{fontSize:11,color:'var(--text-muted)',marginTop:3}}>→ Title: "KOL brief" · Labels: Work, Media · Priority: High · Due: Nov 10</p></div>
      </div>
    )},
    {title:'📋 Views & Features',body:(
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {[['☀️ Today','Tasks hạn hôm nay. Thêm task từ đây tự động set today.'],['📅 Upcoming','Tasks hạn 7 ngày tới.'],['📋 Board','Kanban với custom columns. Drag & drop. Sort theo priority/label/timeline. Manage Columns để add/rename cột.'],['🗓 Calendar','Lịch tháng. Task và sub-task đều hiện theo ngày deadline của từng cái. Click sub-task chip để edit ngay.'],['🌙 Dark Mode','Toggle ở thanh top. Preference được lưu tự động.'],['⧉ Duplicate','Nhân đôi task: nút ⧉ trong task row hoặc task detail modal.'],['↻ Recurring','Set trong task detail: Daily/Weekly/Monthly. Khi complete, app tự tạo lần sau vào lần mở tiếp theo.']].map(([t,d])=>(
          <div key={t} style={{background:'var(--surface2)',borderRadius:8,padding:'9px 12px'}}><p style={{fontSize:12.5,fontWeight:600,color:'var(--text)',marginBottom:3}}>{t}</p><p style={{fontSize:11.5,color:'var(--text-muted)',lineHeight:1.5}}>{d}</p></div>
        ))}
      </div>
    )},
    {title:'✅ Sub-tasks — Full Features',body:(
      <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.7}}>
        <p style={{marginBottom:8}}>Mỗi sub-task giờ là 1 task đầy đủ:</p>
        <ul style={{paddingLeft:16}}>
          <li>Có <strong>due date riêng</strong> → hiển thị độc lập trong calendar</li>
          <li>Có <strong>priority, labels, description</strong> riêng</li>
          <li>Click sub-task trong list → mở <strong>Sub-task modal</strong> để edit đầy đủ</li>
          <li>Trong <strong>calendar</strong>: sub-task hiện với chip màu riêng + viền trái = link về parent</li>
          <li>Trong <strong>list view</strong>: click ▸ để expand/collapse sub-tasks dưới parent</li>
        </ul>
        <div style={{marginTop:10,background:'var(--accent-light)',borderRadius:8,padding:'10px 12px'}}><p style={{fontSize:11,fontWeight:600,color:'var(--accent-dark)',marginBottom:3}}>💡 Use case của Jessie:</p><p style={{fontSize:11,color:'var(--text-muted)'}}>Campaign tháng = 1 task lớn + nhiều sub-task mỗi cái có deadline riêng → Calendar thấy từng bước theo ngày, List vẫn clean 1 task lớn.</p></div>
      </div>
    )},
    {title:'⌨️ Phím tắt',body:(
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
        <tbody>{[['Q','Mở Quick Add'],['Ctrl + N','Mở Quick Add (shortcut mới)'],['Enter','Xác nhận / add task'],['Escape','Đóng modal']].map(([k,d])=>(
          <tr key={k} style={{borderBottom:'1px solid var(--border)'}}><td style={{padding:'8px 0',width:100}}><kbd>{k}</kbd></td><td style={{padding:'8px 10px',color:'var(--text)'}}>{d}</td></tr>
        ))}</tbody>
      </table>
    )},
    {title:'☁️ GitHub + Vercel + Supabase',body:(
      <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.8}}>
        <ol style={{paddingLeft:16}}>
          <li>Push <code>taskflow.html</code> lên GitHub repo</li>
          <li>Vào <strong>vercel.com</strong> → Import repo → Deploy (auto URL)</li>
          <li>Tạo Supabase project → SQL Editor → chạy schema (xem ở Settings ⚙️)</li>
          <li>Vào <strong>Settings</strong> trong app → nhập Supabase URL + Anon Key → Connect</li>
        </ol>
      </div>
    )},
  ];
  return(
    <div style={{maxWidth:720,margin:'0 auto'}}>
      <h1 style={{fontSize:21,fontWeight:700,color:'var(--text)',marginBottom:3}}>Help & Guide v2</h1>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:22}}>TaskFlow v2 — 11 tính năng mới, hướng dẫn đầy đủ</p>
      <div style={{display:'flex',flexDirection:'column',gap:7}}>
        {sections.map((s,i)=>(
          <div key={i} style={{background:'var(--surface)',borderRadius:10,border:'1px solid var(--border)',overflow:'hidden'}}>
            <button onClick={()=>setOpen(open===i?-1:i)} style={{width:'100%',padding:'13px 17px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'none',border:'none',cursor:'pointer',textAlign:'left',fontFamily:'inherit'}}>
              <span style={{fontWeight:600,fontSize:13.5,color:'var(--text)'}}>{s.title}</span>
              <span style={{color:'var(--text-faint)',fontSize:11}}>{open===i?'▲':'▼'}</span>
            </button>
            {open===i&&<div className="afu" style={{padding:'2px 17px 17px'}}>{s.body}</div>}
          </div>
        ))}
      </div>
      <div style={{marginTop:22,background:'linear-gradient(135deg,#4f46e5,#7c3aed)',borderRadius:12,padding:'18px 22px',color:'white'}}>
        <h3 style={{fontWeight:700,marginBottom:8,fontSize:14}}>🚀 Quick Start v2</h3>
        <ol style={{paddingLeft:17,lineHeight:2.1,fontSize:12.5}}>
          <li>Nhấn <kbd style={{background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',color:'white',borderRadius:4,padding:'1px 6px',fontSize:11}}>Q</kbd> hoặc <kbd style={{background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',color:'white',borderRadius:4,padding:'1px 6px',fontSize:11}}>Ctrl+N</kbd> để mở Quick Add</li>
          <li>Thử: <code style={{background:'rgba(255,255,255,.15)',color:'#e0e7ff',padding:'1px 7px',borderRadius:4}}>KOL brief #Work #Media !High Nov10</code></li>
          <li>Click task → expand ▸ để xem sub-tasks → click sub-task để edit đầy đủ</li>
          <li>Board → Manage Columns để thêm cột tùy chỉnh</li>
          <li>🌙 để bật dark mode · ⚙️ để export/import JSON</li>
        </ol>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
